name: liferay-ai-chat-with-content
services:
  elasticsearch:
    build:
      dockerfile: elasticsearch/Dockerfile
      context: .
    networks:
      - fs74AICWD
    ports:
      - ${ELASTICSEARCH_HOST_PORT:-9200}:9200
      - ${ELASTICSEARCH_TRANSPORT_HOST_PORT:-9300}:9300
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-plugins:/usr/share/elasticsearch/plugins
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  database:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - fs74AICWD
    ports:
      - ${MYSQL_HOST_PORT:-3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_USER: ${MYSQL_USER:-liferay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-liferay}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lfr74AICWDlportal}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  liferay:
    image: liferay/dxp:2026.q2.0
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      LIFERAY_RETRY_PERIOD_JDBC_PERIOD_ON_PERIOD_STARTUP_PERIOD_DELAY: 10
      LIFERAY_RETRY_PERIOD_JDBC_PERIOD_ON_PERIOD_STARTUP_PERIOD_MAX_PERIOD_RETRIES: 10
      LIFERAY_JVM_OPTS: "-Xms2560m -Xmx4096m"
    networks: 
      - fs74AICWD
    ports: 
      - ${LIFERAY_HOST_PORT:-8080}:8080
      - 127.0.0.1:${LIFERAY_DEBUG_HOST_PORT:-11311}:11311
    volumes:
      - ./liferay-74/mount:/mnt/liferay
      - liferay-tools:/opt/liferay/tools
      - liferay-data:/opt/liferay/data
      - liferay-osgi-configs:/opt/liferay/osgi/configs
      - liferay-osgi-marketplace:/opt/liferay/osgi/marketplace
      - liferay-osgi-modules:/opt/liferay/osgi/modules
      - liferay-osgi-war:/opt/liferay/osgi/war
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/c/portal/robots >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
  kibana:
    image: kibana:8.19.15
    networks:
      - fs74AICWD
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  ollama:
    build: 
      context: .
      dockerfile: ollama/ollama.Dockerfile
    gpus: all
    networks: 
      - fs74AICWD
    ports:
      - ${OLLAMA_HOST_PORT:-11434}:11434
    volumes:
      - ollama_data:/root/.ollama/models
    post_start:
      - command: /home/ollama/install-models.sh
        privileged: true
    healthcheck:
      test: ["CMD", "ollama", "list"]  # Check if Ollama is responding
      interval: 10s                    # Run the health check every 10 seconds
      timeout: 30s                     # Timeout for the health check is 30 seconds
      retries: 5                       # Retry 5 times before marking it as unhealthy
      start_period: 10s                # Wait 10 seconds before starting health checks
    depends_on:
      kibana:
        condition: service_healthy
  txtai:
    build:
      dockerfile: Dockerfile
      context: txtai
      args:
        TXTAI_TAG: ${TXTAI_TAG:-latest}
    networks: 
      - fs74AICWD
    ports:
      - ${TXTAI_HOST_PORT:-8001}:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  chatbot-backend:
    build:
      dockerfile: client-extensions/chatbot-backend/Dockerfile
      context: ../liferay-workspace
    networks: 
      - fs74AICWD
    ports:
      - ${CHATBOT_BACKEND_HOST_PORT:-58081}:58081
    depends_on:
      liferay:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${AI_CHATBOT_BACKEND_SPRING_PROFILES_ACTIVE:-localdocker}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:58081/ready | grep -q 'READY' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
networks:
  fs74AICWD:
    name: fs74AICWD
volumes:
  elasticsearch-data:
  elasticsearch-plugins:
  liferay-data:
  liferay-tools:
  liferay-osgi-configs:
  liferay-osgi-marketplace:
  liferay-osgi-modules:
  liferay-osgi-war:
  mysql:
  ollama_data: