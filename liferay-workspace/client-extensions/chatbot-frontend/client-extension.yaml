chatbot-frontend-custom-element-frontend:
    cssURLs:
        - css/main.*.css
    friendlyURLMapping: chatbot-frontend
    htmlElementName: chatbot-frontend
    instanceable: false
    name: Chatbot
    portletCategoryName: category.client-extensions
    type: customElement
    urls:
        - js/main.*.js
    useESM: true
